<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/Events/Cover%20photos/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>St. Francis Xavier's Church - Web App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body
  class="font-sans antialiased text-church-violet dark:text-gray-100 bg-church-cream dark:bg-slate-900 selection:bg-church-purple selection:text-white min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
</body>

</html>
